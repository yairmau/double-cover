project:
  type: book
  output-dir: docs

book:
  title: "double cover"
  author: "Yair Mau"
  repo-url: https://github.com/yairmau/double-cover/
  favicon: archive/logo/favicon-32.svg
  chapters:
    - index.qmd
    - part: "math fundamentals"
      chapters:
        - math_fundamentals/det_exp_trace.ipynb
        - math_fundamentals/conjugation.ipynb
    - part: "spinors for beginners"
      chapters:
        - spinors_for_beginners/jones_vectors.qmd
        - spinors_for_beginners/su2_rotations.qmd
        - spinors_for_beginners/stern_gerlach.qmd
        - spinors_for_beginners/flagpole_sphere.qmd
    - part: "SL(2,C)"
      chapters:
        - sl2c/sl2.ipynb
        - sl2c/real_forms_of_sl2.ipynb
        - sl2c/su2_and_spinors.ipynb
  sidebar:
    collapse-level: 1
    header: "[← Back to yairmau.com](https://yairmau.com/){.back-home}"
    logo: archive/logo/logo.svg
  search: true

format:
  html:
    theme:
      - flatly
      - custom.scss
    css: styles.css
    fontsize: 1.2em
    highlight-style: kate-custom.theme #kate #solarized # kate # tango # breeze # ayu # monokai # breezedark # espresso
    include-in-header:
      - includes.html
    code-line-numbers: true
    code-tools:
      source: repo  # https://quarto.org/docs/output-formats/html-code.html#code-tools
    callout-icon: false
    fig-align: center
    # the default MathJax rendering option yields ugly results, use katex
    html-math-method: katex
